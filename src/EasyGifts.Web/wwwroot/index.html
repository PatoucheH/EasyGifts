<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyGifts - Partagez vos listes de cadeaux</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/EasyGifts.UI/css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="EasyGifts.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh;">
            <div style="text-align: center;">
                <h2>Chargement d'EasyGifts...</h2>
                <svg class="loading-progress" style="width: 80px; height: 80px;">
                    <circle r="40%" cx="50%" cy="50%" />
                    <circle r="40%" cx="50%" cy="50%" />
                </svg>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Une erreur s'est produite.
        <a href="." class="reload">Recharger</a>
        <span class="dismiss">X</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
