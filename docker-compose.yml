services:
  postgres:
    image: postgres:17
    container_name: easygifts-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: EasyGiftsDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: easygifts-api
    depends_on:
      - postgres
    environment:
      ConnectionStrings__MyPostgreDB: "Host=postgres;Port=5432;Database=EasyGiftsDb;Username=postgres;Password=postgres"
      ASPNETCORE_URLS: "http://+:5000"
    ports:
      - "5000:5000"

  web:
    build:
      context: .
      dockerfile: src/EasyGifts.Web/Dockerfile
    container_name: easygifts-web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
