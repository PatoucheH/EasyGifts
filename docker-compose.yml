version: '3.9'

services:
  postgres:
    image: postgres:17
    container_name: easygifts-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: EasyGiftsDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: EasyGiftsBackend.Api/Dockerfile
    container_name: easygifts-api
    depends_on:
      - postgres
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=EasyGiftsDb;Username=postgres;Password=postgres"
    ports:
      - "5000:5000"

volumes:
  pgdata:
